command_processor_workers: 2
command_queue_max_size: 1000
logging:
  file_path: logs/gateway.log
  level: DEBUG
redis:
  db: 0
  host: localhost
  password: null
  port: 6379
shuttle_health_check_interval: 30
shuttle_listener_port: 8181
shuttles:
  shuttle_2:
    command_port: 2000
    host: 10.10.10.12
    response_port: 5000
    shuttle_health_check_interval: 10
  test_shuttle_1:
    command_port: 2000
    host: 10.181.80.100
    response_port: 5000
    shuttle_health_check_interval: 10
  test_shuttle_2:
    command_port: 2000
    host: 10.181.80.101
    response_port: 5000
    shuttle_health_check_interval: 10
  test_shuttle_3:
    command_port: 2000
    host: 10.181.80.102
    response_port: 5000
    shuttle_health_check_interval: 10
  virtual_shuttle_1:
    command_port: 2000
    host: 10.181.80.134
    response_port: 5000
    shuttle_health_check_interval: 10
stock_to_shuttle:
  Второй склад:
  - shuttle_2
  Главный:
  - virtual_shuttle_1
  - test_shuttle_1
  - test_shuttle_2
  - test_shuttle_3
tcp_connect_timeout: 5.0
tcp_read_timeout: 20.0
tcp_write_timeout: 5.0
wms:
  api_url: http://10.181.80.28:8080/
  password: '1000'
  poll_interval: 5
  username: '1000'
  webhook_url: http://wms-server/webhook
